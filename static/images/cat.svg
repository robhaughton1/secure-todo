    <!-- Inner ears -->
    <path d="M53 63 L51 38 L70 55 Z" fill="#D69FA9"/>
    <path d="M115 55 L131 38 L130 63 Z" fill="#D69FA9"/>

    <!-- Head -->
    <ellipse cx="91" cy="88" rx="51" ry="43"
