    <g stroke="#B9A9B5" stroke-width="2">
        <path d="M92 151 H112"/>
        <path d="M92 169 H112"/>
        <path d="M75 185 H112"/>
    </g>

    <!-- Paws holding checklist -->
    <ellipse cx="64" cy="158" rx="10" ry="13"
