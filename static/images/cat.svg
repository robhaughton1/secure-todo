    <!-- Checklist -->
    <rect x="65" y="133" width="58" height="66" rx="5"
          fill="#FFF9F0"
          stroke="#6C566A"
          stroke-width="2.5"/>

    <rect x="84" y="128" width="20" height="9" rx="3"
