<svg xmlns="http://www.w3.org/2000/svg"
     width="420"
     height="130"
     viewBox="0 0 420 130">

<path
    d="M 30 35 Q 30 115 210 120"
    stroke="#779B7C"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
/>

<path d="M 210 120 Q 390 115 390 35"
      stroke="#779B7C"
      stroke-width="3"
      fill="none"
/>

<defs>
    <ellipse id="leaf"
             rx="7"
             ry="14"
             fill="#91AD8E"/>
             

<g id="flower">
    <ellipse cx="0" cy="-9" rx="5" ry="9" fill="currentColor"/>
    <ellipse cx="0" cy="-9" rx="5" ry="9" fill="currentColor" transform="rotate(60)"/>
    <ellipse cx="0" cy="-9" rx="5" ry="9" fill="currentColor" transform="rotate(120)"/>
    <ellipse cx="0" cy="-9" rx="5" ry="9" fill="currentColor" transform="rotate(180)"/>
    <ellipse cx="0" cy="-9" rx="5" ry="9" fill="currentColor" transform="rotate(240)"/>
    <ellipse cx="0" cy="-9" rx="5" ry="9" fill="currentColor" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="4" fill="#F2CE73"/>
</g>
</defs>

<use href="#flower" x="85" y="109" color="#D6B4E9"/>
<use href="#flower" x="335" y="109" color="#D6B4E9"/>
<use href="#flower" x="160" y="120" color="#F3BDD5"/>
<!-- Pink flower on the right -->
<use href="#flower" x="260" y="120" color="#F3BDD5"/>

<use href="#leaf" x="55" y="55"
     transform="rotate(35 55 55)"/>

<use href="#leaf" x="92" y="91"
     transform="rotate(30 92 91)"/>

<use href="#leaf" x="125" y="111"
     transform="rotate(-50 125 111)"/>

<use href="#leaf" x="365" y="55"
     transform="rotate(-35 365 55)"/>

<use href="#leaf" x="328" y="91"
     transform="rotate(-30 328 91)"/>

<use href="#leaf" x="295" y="111"
     transform="rotate(50 295 111)"/>

<!-- Small yellow flowers near the upper ends -->
<g transform="translate(38 53) rotate(-15) scale(0.75)">
    <use href="#flower" color="#F5D98A"/>
</g>

<g transform="translate(382 53) rotate(15) scale(0.75)">
    <use href="#flower" color="#F5D98A"/>
</g>

<use href="#leaf"
     x="48"
     y="67"
     transform="rotate(-40 48 67)"/>

<use href="#leaf"
     x="75"
     y="91"
     transform="rotate(-55 75 91)"/>

<use href="#leaf"
     x="105"
     y="106"
     transform="rotate(-65 105 106)"/>

<use href="#leaf"
     x="372"
     y="67"
     transform="rotate(40 372 67)"/>

<use href="#leaf"
     x="345"
     y="91"
     transform="rotate(55 345 91)"/>

<use href="#leaf"
     x="315"
     y="106"
     transform="rotate(65 315 106)"/>
</svg>

