{% extends 'base.html' %}
{% block title %}Fernward | Delete task{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/tasks.css') }}">{% endblock %}
{% block content %}
{% include 'partials/public-nav.html' %}
<main id="main" class="delete-confirm-page">
  <h1>Delete task?</h1>
  <p class="task-title">{{ task.title }}</p>
  <p>This cannot be undone.</p>
  <form action="{{ url_for('delete_task', task_id=task.id) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="confirm_delete" value="yes">
    <div class="dialog-actions"><a class="dialog-cancel" href="{{ url_for('dashboard') }}">Cancel</a><button class="button danger-button" type="submit">Delete task</button></div>
  </form>
</main>
{% endblock %}
