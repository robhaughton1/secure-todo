{% from 'partials/icons.html' import icon %}
{% macro task_row(task, csrf_token) -%}
<li class="task-list-item{% if task and task.completed %} is-complete{% endif %}" data-task-row data-task-id="{{ task.id if task else '' }}">
  <form action="{{ url_for('toggle_task', task_id=task.id) if task else '' }}" method="POST" data-task-toggle>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="task-check">
      <input type="checkbox" {% if task and task.completed %}checked{% endif %}>
      <span class="task-title">{{ task.title if task else '' }}</span>
    </label>
    <label>
      <span class="task-priority">{{ task.priority if task else '' }}</span>
    </label>
    <button class="task-save" type="submit">Apply change</button>
  </form>
  <form action="{{ url_for('delete_task', task_id=task.id) if task else '' }}" method="POST" data-task-delete>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="task-delete-button" aria-label="Delete task{% if task %}: {{ task.title }}{% endif %}">{{ icon('trash') }}</button>
  </form>
</li>
{%- endmacro %}
