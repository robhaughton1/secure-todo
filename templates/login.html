<!DOCTYPE html>
<html lang="en">
    <head>  
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <title>Login</title>  
        <link rel="stylesheet" href="/static/css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    </head>
    <body>  
        <div class="authContainer">
           
                <h2>Login</h2>
             <form id="loginForm" class="authForm" method="post" action="/login">
               
                <div class="usernameContainer">
                    <div>Username</div>
                    <input type="text" name="username">
                </div>
            
                <div class="passwordContainer">
                    <div>Password</div>
                    <input type="password" name="password">
                </div>
                {% if error %}
                    <p style="color: rgb(231, 205, 205); background-color: rgb(199, 107, 107); display: flex; justify-content: center;  outline: 3px solid #b35353;">{{ error }}</p>
                {% endif %}
                <div class="authButtonDiv">
                    <button type="submit" id="loginButton" class="authButton">Login</button>
                </div>
             </form>
        </div>
    </body>
</html>
