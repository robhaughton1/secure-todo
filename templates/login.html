<!DOCTYPE html>
<html lang="en">
    <head>  
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <title>Login</title>  
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    </head>
    <body>  
        <div class="authContainer">
           
                <h2>Login</h2>
             <form id="loginForm" class="loginForm"></form>

                <div class="usernameContainer">
                    <div>Username</div>
                    <input type="text" type="text">
                </div>

                <div class="passwordContainer">
                    <div>Password</div>
                    <input type="password">
                </div>

                <div class="loginButtonDiv">
                    <button type="submit" id="loginButton" class="loginButton">Login</button>
                </div>
                
        </div>
        

        <div class="appContainer">
        <h1 class="header">TODOS</h1>  
            <div class="add_todo">
                <input class="">Add Todo</input>
                
            
            
            <div id="todos_container" class="container">
                <div class="todo">1</div>
                <div class="todo">2</div>
                <div class="todo">3</div>
                <div class="todo">4</div>
        </div>
        <script src="login.js"></script>
        
    </body>
    </html>
