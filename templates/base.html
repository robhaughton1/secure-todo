<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>
{% block title %}Fernward{% endblock %}
</title>
<script src="{{ url_for('static', filename='js/theme.js') }}">
</script>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/fernward-mark.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/cozy.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/woodland.css') }}">
<script src="{{ url_for('static', filename='js/interface.js') }}" defer>
</script>
{% block head %}
{% endblock %}
</head>
<body class="{% block body_class %}
{% endblock %}">
<a class="skip-link" href="#main">Skip to content</a>
{% block content %}
{% endblock %}
</body>
</html>
